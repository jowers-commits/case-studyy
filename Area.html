<section class="hero">
    <h1>Area Calculator</h1>
    <p>Calculate the area of common geometric shapes.</p>
</section>

<section class="card">

    <label>Choose a shape</label>

    <select id="shape" onchange="showFields()">
        <option value="square">Square</option>
        <option value="rectangle">Rectangle</option>
        <option value="triangle">Triangle</option>
        <option value="circle">Circle</option>
    </select>

    <div id="fields"></div>

    <button onclick="calculateArea()">Calculate</button>

    <div class="result">
        <div>Result</div>
        <div class="value" id="result">--</div>
    </div>

</section>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Discount Calculator - CalcWise</title>

    
    <link rel="stylesheet" href="study.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <img src="calc.jpg" alt="CalcWise Logo" class="logo-img">
            CALCWISE</div>
    </header>
    <a class="back" href="money.html">← Back to About Money</a>

    <!-- Main Calculator -->
    <main class="calculator-container">

        <h1>Discount Calculator</h1>

        <p>Calculate the discount amount and final price.</p>

        <form id="discountForm">

            <label for="originalPrice">Original Price</label>

            <input
                type="number"
                id="originalPrice"
                name="originalPrice"
                placeholder="Enter original price"
                min="0"
                step="0.01"
                required
            >

            <label for="discount">Discount (%)</label>

            <input
                type="number"
                id="discount"
                name="discount"
                placeholder="Enter discount percentage"
                min="0"
                max="100"
                step="0.01"
                required
            >

            <button type="submit">Calculate</button>

        </form>

        <!-- Result will appear here -->
        <div id="result"></div>

    </main>

    
    <script src="discount.js"></script>

</body>

</html>

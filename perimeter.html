<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perimeter Calculator - CalcWise</title>

    <link rel="stylesheet" href="study.css">
</head>

<body>

<header>

    <div class="logo
    <img src="calc.jpg" alt="CalcWise Logo" class="logo-img">
    CALCWISE</div>

        <nav>
        <a href="index.html">Home</a>
        <a href="index.html">All Calculators</a>
        <a href="#">About</a>
    </nav>


</header>

<main>

    <a class="back" href="math.html">← Back to Mathematics and Science Calc</a>

    <section class="hero">

        <h1>Perimeter Calculator</h1>

        <p>
            Calculate the perimeter of a square, rectangle, triangle, or circle.
        </p>

    </section>

    <section class="card">

        <label>Select Shape</label>

        <select id="shape" onchange="showInputs()">

            <option value="square">Square</option>
            <option value="rectangle">Rectangle</option>
            <option value="triangle">Triangle</option>
            <option value="circle">Circle</option>

        </select>


        <div id="inputs">

            <label>Enter Side</label>

            <input
                type="number"
                id="side"
                placeholder="Enter side"
            >

        </div>


        <button onclick="calculatePerimeter()">
            Calculate Perimeter
        </button>


        <div class="result">

            <div>Perimeter</div>

            <div class="value" id="result">--</div>

        </div>

    </section>

</main>

<footer>
    © 2026 CalcWise. All rights reserved.
</footer>


<script>

function showInputs() {

    let shape = document.getElementById("shape").value;

    let inputs = document.getElementById("inputs");


    if (shape === "square") {

        inputs.innerHTML = `
            <label>Enter Side</label>

            <input
                type="number"
                id="side"
                placeholder="Enter side"
            >
        `;

    } else if (shape === "rectangle") {

        inputs.innerHTML = `
            <label>Enter Length</label>

            <input
                type="number"
                id="length"
                placeholder="Enter length"
            >

            <label>Enter Width</label>

            <input
                type="number"
                id="width"
                placeholder="Enter width"
            >
        `;

    } else if (shape === "triangle") {

        inputs.innerHTML = `
            <label>Enter Side 1</label>

            <input
                type="number"
                id="side1"
                placeholder="Enter side 1"
            >

            <label>Enter Side 2</label>

            <input
                type="number"
                id="side2"
                placeholder="Enter side 2"
            >

            <label>Enter Side 3</label>

            <input
                type="number"
                id="side3"
                placeholder="Enter side 3"
            >
        `;

    } else {

        inputs.innerHTML = `
            <label>Enter Radius</label>

            <input
                type="number"
                id="radius"
                placeholder="Enter radius"
            >
        `;
    }

}


function calculatePerimeter() {

    let shape =
        document.getElementById("shape").value;

    let result;


    if (shape === "square") {

        let side =
            Number(document.getElementById("side").value);

        if (isNaN(side) || side <= 0) {

            document.getElementById("result").textContent =
                "Please enter a valid side.";

            return;
        }

        result = 4 * side;


    } else if (shape === "rectangle") {

        let length =
            Number(document.getElementById("length").value);

        let width =
            Number(document.getElementById("width").value);


        if (
            isNaN(length) ||
            isNaN(width) ||
            length <= 0 ||
            width <= 0
        ) {

            document.getElementById("result").textContent =
                "Please enter valid dimensions.";

            return;
        }

        result = 2 * (length + width);


    } else if (shape === "triangle") {

        let side1 =
            Number(document.getElementById("side1").value);

        let side2 =
            Number(document.getElementById("side2").value);

        let side3 =
            Number(document.getElementById("side3").value);


        if (
            isNaN(side1) ||
            isNaN(side2) ||
            isNaN(side3) ||
            side1 <= 0 ||
            side2 <= 0 ||
            side3 <= 0
        ) {

            document.getElementById("result").textContent =
                "Please enter valid sides.";

            return;
        }

        result = side1 + side2 + side3;


    } else {

        let radius =
            Number(document.getElementById("radius").value);


        if (isNaN(radius) || radius <= 0) {

            document.getElementById("result").textContent =
                "Please enter a valid radius.";

            return;
        }

        result = 2 * Math.PI * radius;
    }


    document.getElementById("result").textContent =
        result.toFixed(2) + " units";

}

</script>

</body>

</html>

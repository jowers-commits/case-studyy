<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Percentage Calculator - CalcWise</title>

    <link rel="stylesheet" href="study.css">
</head>

<body>

<header>

    <div class="logo">
        <img src="calc.jpg" alt="CalcWise Logo" class="logo-img">
         CALCWISE</div>

        <nav>
        <a href="index.html">Home</a>
        <a href="index.html">All Calculators</a>
        <a href="#">About</a>
    </nav>


</header>

<main>

    <a class="back" href="IT.html">← Back to IT CALC</a>

    <section class="hero">

        <h1>Attendance Percentage Calculator</h1>

        <p>Calculate your attendance percentage easily.</p>

    </section>

    <section class="card">

        <label>Total Classes</label>

        <input
            type="number"
            id="totalClasses"
            placeholder="Enter total classes"
        >

        <label>Classes Attended</label>

        <input
            type="number"
            id="attendedClasses"
            placeholder="Enter classes attended"
        >

        <button onclick="calculate()">
            Calculate Attendance
        </button>

        <div class="result">

            <div>Attendance Percentage</div>

            <div class="value" id="result">--</div>

        </div>

    </section>

</main>

<footer>
    © 2026 CalcWise. All rights reserved.
</footer>

<script>

function calculate() {

    let totalClasses = Number(
        document.getElementById("totalClasses").value
    );

    let attendedClasses = Number(
        document.getElementById("attendedClasses").value
    );

    
    if (totalClasses <= 0 || attendedClasses < 0) {

        document.getElementById("result").textContent =
            "Please enter valid numbers.";

        return;
    }

    
    if (attendedClasses > totalClasses) {

        document.getElementById("result").textContent =
            "Attended classes cannot exceed total classes.";

        return;
    }

    
    let attendancePercentage =
        (attendedClasses / totalClasses) * 100;

    
    document.getElementById("result").textContent =
        attendancePercentage.toFixed(2) + "%";
}

</script>

</body>

</html>

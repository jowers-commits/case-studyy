 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elementary Grade Average Calculator</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="study.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">
            <img src="calc.jpg" alt="CalcWise Logo" class="logo-img">
            CALCWISE
             </div>

            <nav>
        <a href="index.html">Home</a>
        <a href="index.html">All Calculators</a>
        <a href="#">About</a>
    </nav>


    </header>


    <!-- MAIN CONTENT -->
    <main>

        <a class="back" href="index.html">← Back to Home</a>


        <!-- HERO -->
        <section class="hero">

            <h1>Elementary Grade Average Calculator</h1>

            <p>
                Enter the grades for each subject to calculate the student's average.
            </p>

        </section>


        <!-- CARD -->
        <section class="card">

            <h2>Student Grades</h2>

            <p class="note">
                Enter grades from 0 to 100.
            </p>


            <!-- SUBJECTS -->

            <div class="row">

                <div>
                    <label for="filipino">Filipino</label>
                    <input type="number" id="filipino" min="0" max="100" placeholder="Enter grade">
                </div>

                <div>
                    <label for="english">English</label>
                    <input type="number" id="english" min="0" max="100" placeholder="Enter grade">
                </div>

            </div>


            <div class="row">

                <div>
                    <label for="mathematics">Mathematics</label>
                    <input type="number" id="mathematics" min="0" max="100" placeholder="Enter grade">
                </div>

                <div>
                    <label for="science">Science</label>
                    <input type="number" id="science" min="0" max="100" placeholder="Enter grade">
                </div>

            </div>


            <div class="row">

                <div>
                    <label for="ap">Araling Panlipunan</label>
                    <input type="number" id="ap" min="0" max="100" placeholder="Enter grade">
                </div>

                <div>
                    <label for="esp">Edukasyon sa Pagpapakatao</label>
                    <input type="number" id="esp" min="0" max="100" placeholder="Enter grade">
                </div>

            </div>


            <div class="row">

                <div>
                    <label for="mapeh">MAPEH</label>
                    <input type="number" id="mapeh" min="0" max="100" placeholder="Enter grade">
                </div>

                <div>
                    <label for="tle">TLE / EPP</label>
                    <input type="number" id="tle" min="0" max="100" placeholder="Enter grade">
                </div>

            </div>


            <!-- BUTTON -->

            <button onclick="calculateAverage()">
                Calculate Average
            </button>


            <!-- RESULT -->

            <div class="result">

                <p>Your Average</p>

                <div class="value" id="average">
                    0.00
                </div>

                <p id="remark">
                    Enter all grades to see the result.
                </p>

            </div>

        </section>


        <!-- FOOTER -->

        <footer>
            Elementary Grade Average Calculator
        </footer>

    </main>


    <!-- JAVASCRIPT -->
    <script src="average.js"></script>

</body>

</html>
